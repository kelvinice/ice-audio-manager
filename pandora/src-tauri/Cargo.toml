[workspace]

[package]
name = "pandora"
version = "0.1.0"
description = "Pandora — Native Windows music player inspired by Vivi Music, connected to Ice Audio Manager"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
ice-core = { path = "../../crates/ice-core" }
ice-win = { path = "../../crates/ice-win" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "fs", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
url = "2"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_Networking_WinHttp",
    "Win32_System_Com",
    "Win32_System_Threading",
]

[build-dependencies]
tauri-build = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
codegen-units = 1
strip = true
