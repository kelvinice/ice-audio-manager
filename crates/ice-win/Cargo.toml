[package]
name = "ice-win"
description = "All Windows FFI for Ice Audio Manager: Core Audio, PolicyConfig, spatial sound, media (GSMTC)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ice-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
webview2-com = { workspace = true, optional = true }
windows-core.workspace = true
windows-future.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Globalization",
    "Win32_Devices_Display",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_UI_Accessibility",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[features]
default = []
webview2 = ["dep:webview2-com"]

[lints]
workspace = true
