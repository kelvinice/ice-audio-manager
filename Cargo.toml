[workspace]
resolver = "3"
members = [
    "crates/ice-core",
    "crates/ice-win",
    "spikes/audio",
    "spikes/media",
    "app/src-tauri",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
ice-core = { path = "crates/ice-core" }
ice-win = { path = "crates/ice-win" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Structured logs (code-practices §4); the app installs a subscriber.
tracing = "0.1"
webview2-com = "0.39"
# Must match the `windows` crate's core version; the #[implement]/#[interface] macros expand to `windows_core::…`.
windows-core = "0.62"

[workspace.dependencies.windows]
version = "0.62"
features = [
    "std",
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_Audio",
    "Media_Control",
    "Media_Devices",
    "Storage_Streams",
    "Win32_Devices_Display",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
