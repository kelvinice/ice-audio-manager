[[permission]]
identifier = "read-notch-snapshot"
description = "Read the state shown by both shell windows."
commands.allow = ["get_notch_snapshot"]

[[permission]]
identifier = "notch-controls"
description = "Operate the notch and its audio controls."
commands.allow = [
  "get_engine_snapshot", "report_hit_rect", "report_first_paint", "report_event_rendered",
  "adjust_volume", "set_volume", "toggle_mute", "toggle_mic_mute", "trigger_switch", "switch_to_device",
  "media_command", "open_music_service", "toggle_expand", "request_idle_suspend", "open_settings", "set_hibernate", "start_notch_drag",
]

[[permission]]
identifier = "allow-set-visualizer"
description = "Request peak frames for the visible notch visualizer."
commands.allow = ["set_visualizer"]

[[permission]]
identifier = "report-settings-ready"
description = "Report first paint of the Settings window."
commands.allow = ["report_settings_ready"]

[[permission]]
identifier = "settings-controls"
description = "Read engine state, change settings, manage lyrics storage and launch at sign-in from the Settings window."
commands.allow = [
  "get_engine_snapshot", "apply_setting", "get_launch_at_sign_in", "set_launch_at_sign_in",
  "get_lyrics_storage_stats", "clear_lyrics_cache", "open_lyrics_folder", "open_language_settings",
]
