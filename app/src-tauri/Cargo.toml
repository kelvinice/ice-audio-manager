[package]
name = "ice-audio-manager"
description = "Ice Audio Manager Windows desktop shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ice-core.workspace = true
ice-win = { workspace = true, features = ["webview2"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
ts-rs = "12"
# Reuse Tauri's tray-icon dependency for its Windows GUID-based registration.
tray-icon = { version = "0.25", default-features = false }

[dev-dependencies]
ice-core = { workspace = true, features = ["ts"] }

[build-dependencies]
tauri-build = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
