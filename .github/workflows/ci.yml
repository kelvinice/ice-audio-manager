name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - name: UI install, check, test, build
        working-directory: app/ui
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      # rust-toolchain.toml pins the version; rustup installs it on first cargo call.
      - name: Show toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Test engine contract with TypeScript bindings
        run: cargo test -p ice-core --all-features
      - name: Build (release)
        run: cargo build --workspace --release
